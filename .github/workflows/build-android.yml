name: Build CampusPulse Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install app dependencies
        run: npm ci

      - name: Restore Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            umask 077
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "FIREBASE_ANDROID_CONFIG_BASE64 is not configured; this APK will not receive push notifications."
          fi

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campuspulse-release.jks"
          fi

      - name: Build installable APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/campuspulse-release.jks"
            ./gradlew assembleRelease
          else
            echo "Signing secrets are not configured; building a debug APK."
            ./gradlew assembleDebug
          fi

      - name: Name APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk CampusPulse.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk CampusPulse.apk
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusPulse-Android
          path: CampusPulse.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to a public download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: CampusPulse Android (latest)
          body: |
            Automatically rebuilt from commit ${{ github.sha }}.
            Download `CampusPulse.apk` below and install it on your device to pick up native (Java/Bluetooth) changes.
            Web-only (HTML/CSS/JS) changes reach installed apps automatically; native changes require reinstalling this APK.
          files: CampusPulse.apk
          make_latest: true
