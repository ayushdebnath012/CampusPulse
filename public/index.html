<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b5bd6" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="CampusPulse helps professors manage private courses and official rosters while teaching teams run attendance and quick quizzes."
    />
    <title>CampusPulse — Classroom operations, simplified</title>
    <link rel="stylesheet" href="styles.css?v=38" />
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2M16 5a3 3 0 0 1 0 6m2 2a4 4 0 0 1 3 4v3"/></symbol>
      <symbol id="i-quiz" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 8h8M8 12h5M8 16h7"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18H6a4 4 0 1 1 1-7.9A6 6 0 0 1 18.7 12H19a3 3 0 0 1 0 6h-3M12 13v8m-3-3 3 3 3-3"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9a15 15 0 0 1 18 0M6 13a10 10 0 0 1 12 0M9.5 17a4.3 4.3 0 0 1 5 0"/><circle cx="12" cy="20" r="1"/></symbol>
      <symbol id="i-bluetooth" viewBox="0 0 24 24"><path d="m8 7 8 10-4 4V3l4 4L8 17"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 4 18 8-18 8 4-8zM7 12h14"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 19h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M5 20h14"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3M10 8l-4 4 4 4M6 12h11"/></symbol>
    </svg>

    <section id="authRoot" class="auth-root" aria-live="polite"></section>

    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar">
        <button class="brand" data-route="dashboard" aria-label="Go to dashboard">
          <span class="brand-mark">C</span>
          <span class="brand-name">Campus<span>Pulse</span></span>
        </button>

        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-item active" data-route="dashboard" aria-label="Overview" aria-current="page"><svg><use href="#i-grid"/></svg><span>Overview</span></button>
          <button class="nav-item" data-route="schedule" aria-label="Schedule"><svg><use href="#i-calendar"/></svg><span>Schedule</span></button>
          <button class="nav-item" data-route="classes" aria-label="Courses"><svg><use href="#i-users"/></svg><span>Courses</span></button>
          <button class="nav-item" id="studentsNav" data-route="students" aria-label="Students"><svg><use href="#i-users"/></svg><span>Students</span></button>
          <button class="nav-item" data-route="materials" aria-label="Materials"><svg><use href="#i-cloud"/></svg><span>Materials</span></button>
          <button class="nav-item" id="attendanceNav" data-route="attendance" aria-label="Attendance"><svg><use href="#i-users"/></svg><span>Attendance</span></button>
          <button class="nav-item" data-route="quizzes" aria-label="Quizzes"><svg><use href="#i-quiz"/></svg><span>Quizzes</span></button>
        </nav>

        <div class="side-bottom">
          <button class="nav-item" data-route="settings" aria-label="Settings"><svg><use href="#i-settings"/></svg><span>Settings</span></button>
          <div class="user-card">
            <div class="avatar" id="profileAvatar">FD</div>
            <div><strong id="profileName">Faculty Demo</strong><span id="profileMeta">Instructor · CSE</span></div>
            <button class="icon-btn" data-action="logout" aria-label="Sign out"><svg><use href="#i-more"/></svg></button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-lead">
            <button class="icon-btn menu-btn" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="appMenu"><svg><use href="#i-menu"/></svg></button>
            <button class="icon-btn back-nav-btn" id="backNav" type="button" aria-label="Go back" hidden><svg><use href="#i-back"/></svg></button>
            <div>
              <p class="eyebrow" id="pageEyebrow">THURSDAY, 30 JULY</p>
              <h1 id="pageTitle" tabindex="-1">Good morning, Faculty</h1>
            </div>
          </div>
          <div class="top-actions">
            <label class="course-switcher" id="courseSwitcherWrap" hidden>
              <svg aria-hidden="true"><use href="#i-users"/></svg>
              <span>Course</span>
              <select id="courseSwitcher" aria-label="Active course"></select>
            </label>
            <button class="icon-btn settings-btn" data-route-link="settings" aria-label="Settings"><svg><use href="#i-settings"/></svg></button>
            <button class="btn btn-primary" id="quickAction"><svg><use href="#i-bell"/></svg>Class reminders</button>
          </div>
        </header>

        <section id="view" class="view"></section>
      </main>

      <div class="menu-scrim" id="menuScrim"></div>
      <aside class="app-menu" id="appMenu" aria-label="Account menu" aria-hidden="true">
        <div class="app-menu-head">
          <div class="avatar" id="menuAvatar">FD</div>
          <div>
            <strong id="menuName">Faculty Demo</strong>
            <span id="menuMeta">Instructor · CSE</span>
          </div>
          <button class="icon-btn" id="menuClose" type="button" aria-label="Close menu"><svg><use href="#i-close"/></svg></button>
        </div>
        <nav class="app-menu-nav" aria-label="Account options">
          <button class="app-menu-item" type="button" data-route-link="settings"><svg><use href="#i-settings"/></svg><span>Settings</span></button>
          <button class="app-menu-item danger" type="button" data-action="logout"><svg><use href="#i-logout"/></svg><span>Sign out</span></button>
        </nav>
      </aside>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="assertive"></div>
    <div id="modalRoot"></div>
    <aside id="updateBanner" class="update-banner" role="status" hidden>
      <div>
        <strong>CampusPulse update ready</strong>
        <span id="updateBannerMessage">Restart to use the latest improvements.</span>
      </div>
      <button class="btn btn-primary" type="button" data-action="restart-to-update">Restart now</button>
    </aside>
     <script src="config.js?v=13"></script>
     <script src="update-manager.js?v=24"></script>
     <script src="reminder-manager.js?v=2"></script>
     <script src="app.js?v=43"></script>
  </body>
</html>
