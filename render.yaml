services:
  - type: web
    name: campuspulse-api-ayush
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campuspulse-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://ayushdebnath012.github.io,https://localhost,capacitor://localhost
      - key: ALLOW_DEV_VERIFICATION_CODE
        value: "true"

databases:
  - name: campuspulse-db
    plan: free
    region: singapore
    databaseName: campuspulse
    user: campuspulse
